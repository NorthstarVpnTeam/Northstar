name: Build

# Checks every change, then builds the Rust/Tauri Windows app with the pinned
# Xray core bundled into the installer and uploads the NSIS setup + MSI as
# workflow artifacts. Runs on pushes, tags, pull requests and manual dispatch.

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: JS + Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify (syntax, JS tests, Rust tests)
        run: npm run verify

  windows:
    name: Windows build (Tauri + Xray)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    # Needed only for publishing releases on version tags.
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The Tauri shell is compiled for the first time here. This runs the JS
      # syntax check, the JS unit tests and the Rust engine tests.
      - name: Verify (syntax, JS tests, Rust tests)
        run: npm run verify

      # Downloads the pinned Xray release into core/ so tauri.conf.json's
      # resources map ships xray.exe, geoip.dat, geosite.dat and wintun.dll
      # inside the installer.
      - name: Fetch Xray core for bundling
        run: npm run fetch:core

      - name: Build Tauri app and installers
        run: npx tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: northstar-v2ray-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      # Tagging (for example `v2.0.0`) publishes the same binaries to a GitHub
      # Release. Pushes without a tag only produce the workflow artifact.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
          fail_on_unmatched_files: true
