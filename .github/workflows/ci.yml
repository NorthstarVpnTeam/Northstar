name: CI

# Fast feedback: syntax gate + unit tests on every push and pull request.
# No network access is needed by the tests (loopback fixtures only).

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Syntax check + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # `cache: npm` needs a lockfile to hash; fall back to an uncached Node
      # setup (and `npm install` below) while the repository has none.
      - name: Set up Node.js (with npm cache)
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Node.js (no lockfile yet)
        if: hashFiles('package-lock.json') == ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Syntax check every JS file
        run: npm run check

      - name: Unit tests
        run: npm test
